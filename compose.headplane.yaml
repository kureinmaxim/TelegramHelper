# Docker Compose file for Headplane (web UI for Headscale).
#
# Headplane is a modern admin panel for a self-hosted Tailscale coordinator
# (Headscale). Manage users, nodes, pre-auth keys, ACLs, DNS, and routes
# in the browser.
#
# Architecture (Variant A — SSH tunnel, safe by default):
#
#   Browser on Windows → ssh -L 3000:127.0.0.1:3000 root@VPS → headplane :3000
#                                                                       │
#                                                                       │ host loopback
#                                                                       ▼
#                                                                  headscale :8080
#
# Uses `network_mode: host` — Headplane shares the host network namespace,
# so:
#   • it binds directly to the host's 127.0.0.1:3000 (see server.host in
#     config.yaml);
#   • it reaches Headscale at 127.0.0.1:8080 — works both for Headscale
#     started by our compose.headscale.yaml and for an existing standalone
#     install (legacy servers that mount `/etc/headscale/`);
#   • no `depends_on` or compose service-name DNS is required;
#   • no shared compose project with Headscale is required.
#
# This file is standalone — start it separately:
#   docker compose -f compose.headplane.yaml up -d
#
# Before the first start, run ./scripts/install_headplane.sh — it will:
#   • create headplane/data and headplane/config.yaml from the template;
#   • generate cookie_secret (32 hex chars);
#   • find the real Headscale config path (docker inspect) and write it
#     to .env as HEADSCALE_CONFIG_FILE;
#   • issue a Headscale API key via docker exec headscale;
#   • put the key into config.yaml.

services:
  headplane:
    container_name: headplane
    image: ghcr.io/tale/headplane:latest
    restart: unless-stopped

    # Host network: Headplane listens on the host loopback directly.
    # External access is closed via server.host: "127.0.0.1" in config.yaml.
    network_mode: host

    volumes:
      # Headplane config (cookie_secret and Headscale API key).
      - ./headplane/config.yaml:/etc/headplane/config.yaml:ro
      # Headscale config — read-only. Headplane shows settings in the UI.
      # Host path is auto-detected by the installer and written to .env as
      # HEADSCALE_CONFIG_FILE (default: /etc/headscale/config.yaml).
      - ${HEADSCALE_CONFIG_FILE:-/etc/headscale/config.yaml}:/etc/headscale/config.yaml:ro
      # Persist Headplane state (internal DB, cache).
      - ./headplane/data:/var/lib/headplane
      # Docker socket — for integration.docker (signal Headscale after
      # ACL/DNS changes). Read-only is enough.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
