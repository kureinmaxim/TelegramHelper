services:
  # TelegramHelper — bot + API + VLESS-Reality / Hysteria2
  telegram-helper:
    container_name: telegram-helper-lite
    image: telegram-helper-lite:latest
    build: .
    user: "0:0"
    pid: host
    privileged: true
    env_file:
      - .env
    ports:
      # Bound to 127.0.0.1 only — /health is for the docker healthcheck and dockhand,
      # no external need. Public 0.0.0.0:8000 attracts internet scanners (/.env, CONNECT).
      - "127.0.0.1:8000:8000"
    sysctls:
      # Workaround for a PMTU black hole on some VPS uplinks:
      # ICMP "fragmentation needed" is filtered → large TLS responses from
      # api.telegram.org silently dropped → bot polling fails with
      # NetworkError: Bad Gateway / TimedOut. tcp_mtu_probing=2 is aggressive
      # (starts from tcp_base_mss=1024). See DOCKER.md.
      - net.ipv4.tcp_mtu_probing=2
      - net.ipv4.tcp_base_mss=1024
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    dns_search:
      - .
    volumes:
      - ./bot.log:/app/bot.log
      # SSH CLI dashboard history (cli_dashboard.py). Bind-mount so
      # autocomplete / Ctrl+R survive docker compose --force-recreate.
      # Must be a file: pre-created in POST_DEPLOY.md §5 (otherwise Docker
      # creates a directory and history stays in memory — see cli_prompt.py).
      - ./.cli_history:/app/.cli_history
      - ./users.json:/app/users.json
      - ./.env:/app/.env
      - ./app_keys.json:/app/app_keys.json
      - ./vless_config.json:/app/vless_config.json
      - ./naiveproxy_config.json:/app/naiveproxy_config.json
      - /usr/local/etc/xray:/usr/local/etc/xray
      - /etc/caddy-naive:/etc/caddy-naive
      - /etc/hysteria:/etc/hysteria
      - ./hysteria2_config.json:/app/hysteria2_config.json
      - ./tuic_config.json:/app/tuic_config.json
      - ./anytls_config.json:/app/anytls_config.json
      - ./xhttp_config.json:/app/xhttp_config.json
      - ./mtproto_config.json:/app/mtproto_config.json
      - ./headscale_config.json:/app/headscale_config.json
      # Gmail API sender for /email_profile. Token is writable because Google
      # libraries refresh access_token and persist the updated JSON.
      - ./gmail_oauth_client.json:/app/gmail_oauth_client.json:ro
      - ./gmail_token.json:/app/gmail_token.json
      # 3x-ui integration: panel URL/login + AES-256-GCM encrypted password
      # (key from ENCRYPTION_KEY in .env). Without a bind-mount the creds
      # would be wiped on every docker compose up.
      - ./xui_config.json:/app/xui_config.json
      - ./rclone:/rclone:ro
      - /var/run/docker.sock:/var/run/docker.sock
    # Healthcheck is required for Dockhand's condition: service_healthy.
    # python + urllib are present in the slim / python-base bot image.
    healthcheck:
      test:
        - "CMD-SHELL"
        - 'python3 -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(''http://localhost:8000/health'',timeout=2).status==200 else 1)"'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # Filtering proxy in front of the Docker Engine API. Dockhand talks
  # through it instead of mounting /var/run/docker.sock directly — this
  # shrinks the blast radius of a potential RCE in Streamlit/deps.
  docker-socket-proxy:
    container_name: docker-socket-proxy
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    environment:
      # Allow the minimum: list/inspect/logs/stats/restart.
      CONTAINERS: 1
      POST: 1
      # Everything else (IMAGES, VOLUMES, NETWORKS, EXEC, BUILD, …)
      # stays denied by default.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket_proxy
    cap_drop:
      - ALL
    cap_add:
      # HAProxy in the image binds a low port and forks workers.
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # Dockhand — Diagnostics Panel
  dockhand:
    container_name: dockhand
    build:
      context: ./dockhand
    ports:
      - "127.0.0.1:8501:8501"
    restart: unless-stopped
    environment:
      # Talk to Docker Engine through the proxy, not /var/run/docker.sock.
      DOCKER_HOST: "tcp://docker-socket-proxy:2375"
      DOCKHAND_TARGETS: "${DOCKHAND_TARGETS:-telegram-helper-lite}"
      DOCKHAND_API_URL: "${DOCKHAND_API_URL:-http://telegram-helper:8000}"
      DOCKHAND_REFRESH_RATE: "${DOCKHAND_REFRESH_RATE:-5}"
      DOCKHAND_READONLY: "${DOCKHAND_READONLY:-0}"
      # Optional password (defense in depth on top of the SSH tunnel).
      # If empty, auth is off — same behaviour as before.
      DOCKHAND_AUTH_PASSWORD: "${DOCKHAND_AUTH_PASSWORD:-}"
      DOCKHAND_API_KEY: "${DOCKHAND_API_KEY:-}"
      DOCKHAND_APP_ID: "${DOCKHAND_APP_ID:-apiai-v3}"
      # Dockhand sidebar: VPS address from the .env next to compose (substituted at `docker compose up`).
      DOCKHAND_SSH_HOST: "${DOCKHAND_SSH_HOST:-}"
      TELEGRAMHELPER_SSH_HOST: "${TELEGRAMHELPER_SSH_HOST:-}"
      TELEGRAMHELPER_PUBLIC_HOST: "${TELEGRAMHELPER_PUBLIC_HOST:-}"
      PUBLIC_HOST: "${PUBLIC_HOST:-}"
      VPS_HOST: "${VPS_HOST:-}"
    # docker.sock access is no longer needed, so tighten the profile.
    read_only: true
    tmpfs:
      - /tmp:size=64m
      - /home/app/.streamlit:size=8m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    cpus: "0.5"
    networks:
      - default        # → telegram-helper:8000 (internal compose network)
      - socket_proxy   # → docker-socket-proxy:2375
    depends_on:
      telegram-helper:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started
    dns:
      - 8.8.8.8 # Google DNS
      - 1.1.1.1 # Cloudflare DNS
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  default:
    # Pin the default bridge subnet so `compose down` / `up` keeps a stable
    # gateway. Override COMPOSE_DEFAULT_SUBNET in .env on hosts that already
    # use another pool (see DEPLOY.md §8.9 and scripts/preflight_subnets.sh).
    ipam:
      config:
        - subnet: ${COMPOSE_DEFAULT_SUBNET:-172.18.0.0/16}
  # Isolated network for dockhand ↔ docker-socket-proxy.
  # internal: true — no internet egress, no ingress from outside compose.
  socket_proxy:
    internal: true
    # Subnet is pinned too: network create order on `up` is not guaranteed,
    # and if socket_proxy is created first Docker may dynamically assign it
    # the default pool — then the pinned default fails with
    # "Pool overlaps with other one on this address space". On other hosts
    # override COMPOSE_SOCKET_PROXY_SUBNET in .env to this network's
    # existing subnet (see DEPLOY.md §8.9).
    ipam:
      config:
        - subnet: ${COMPOSE_SOCKET_PROXY_SUBNET:-172.28.0.0/24}
