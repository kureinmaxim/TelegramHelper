# Headplane config template для TelegramHelper.
# НЕ редактируйте этот файл напрямую — он шаблон.
# scripts/install_headplane.sh создаёт headplane/config.yaml из этого шаблона
# с реальными значениями (cookie_secret + headscale API key).
#
# Полная схема: https://github.com/tale/headplane/blob/main/config.example.yaml

server:
  # network_mode: host (см. compose.headplane.yaml) → биндим на loopback хоста.
  # Снаружи (с интернета) контейнер недоступен. Доступ — через SSH-туннель.
  host: "127.0.0.1"
  port: 3000

  # Headplane показывает этот URL в UI и использует для callback'ов.
  # Для SSH-туннеля (Вариант А) — http://localhost:3000.
  # Для публикации через nginx — https://panel.your-domain.com (без /admin).
  base_url: "http://localhost:3000"

  # 32-символьный секрет для подписи cookie-сессий.
  # install_headplane.sh подставит сюда случайное значение.
  cookie_secret: "REPLACE_WITH_32_CHAR_RANDOM_STRING"

  # SSH-туннель отдаёт http (не https), поэтому secure-флаг выключаем.
  # Если будете публиковать через reverse-proxy с TLS — поставьте true.
  cookie_secure: false

  cookie_max_age: 86400

  # Persistent data (internal DB, cache). Монтируется как volume.
  data_path: "/var/lib/headplane"

headscale:
  # network_mode: host у headplane → ходим к headscale через loopback хоста.
  # Headscale обычно биндится на 127.0.0.1:8080 (наш compose.headscale.yaml,
  # как и легаси-установки `/etc/headscale/`). Работает в обоих случаях.
  url: "http://127.0.0.1:8080"

  # Public URL, который headplane показывает клиентам Tailscale в UI.
  # install_headplane.sh подставит сюда server_url из headscale_config.json.
  public_url: "https://headscale.your-domain.com"

  # Чтение конфига headscale — даёт UI полную картину серверной стороны.
  config_path: "/etc/headscale/config.yaml"

  # API ключ для server-side операций (читает ноды, пользователей, ключи).
  # install_headplane.sh выпустит ключ через `docker exec headscale headscale
  # apikeys create --expiration 90d` и подложит сюда.
  api_key: "REPLACE_WITH_HEADSCALE_API_KEY"

  # strict=false — не падать, если headscale обновится и в config.yaml
  # появятся поля, неизвестные headplane. Безопаснее для долгоживущего deploy.
  config_strict: false

integration:
  agent:
    enabled: false
    # headplane >= 0.6.x валидирует это поле ДАЖЕ при enabled:false — должно
    # быть строкой. Агент выключен, поэтому значение-заглушка не используется.
    pre_authkey: "unused-agent-disabled"

  docker:
    # Включаем — headplane сможет ребутить headscale после смены ACL/DNS.
    enabled: true
    # По container_name, не по label — у нас контейнер называется headscale.
    container_name: "headscale"
    socket: "unix:///var/run/docker.sock"

  kubernetes:
    enabled: false
    # headplane >= 0.6.x требует это поле строкой даже при enabled:false.
    pod_name: "headscale"

  proc:
    enabled: false

# OIDC выключен — авторизация через headscale API key (вход на /admin).
# Включайте, только если есть IdP (Authentik/Keycloak/Google) и понимаете
# зачем. См. https://headplane.net/features/sso
