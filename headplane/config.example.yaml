# Headplane config template for TelegramHelper.
# Do not edit this file directly — it is a template.
# scripts/install_headplane.sh creates headplane/config.yaml from this
# template with real values (cookie_secret + Headscale API key).
#
# Full schema: https://github.com/tale/headplane/blob/main/config.example.yaml

server:
  # network_mode: host (see compose.headplane.yaml) → bind to the host loopback.
  # The container is not reachable from the internet. Access via SSH tunnel.
  host: "127.0.0.1"
  port: 3000

  # Headplane shows this URL in the UI and uses it for callbacks.
  # For an SSH tunnel (Variant A) — http://localhost:3000.
  # For nginx publication — https://panel.your-domain.com (without /admin).
  base_url: "http://localhost:3000"

  # 32-character secret for signing cookie sessions.
  # install_headplane.sh substitutes a random value here.
  cookie_secret: "REPLACE_WITH_32_CHAR_RANDOM_STRING"

  # The SSH tunnel serves http (not https), so the secure flag is off.
  # Set true if you publish through a TLS reverse proxy.
  cookie_secure: false

  cookie_max_age: 86400

  # Persistent data (internal DB, cache). Mounted as a volume.
  data_path: "/var/lib/headplane"

headscale:
  # Headplane uses network_mode: host → reach Headscale via the host loopback.
  # Headscale usually binds 127.0.0.1:8080 (our compose.headscale.yaml,
  # same as legacy `/etc/headscale/` installs). Works in both cases.
  url: "http://127.0.0.1:8080"

  # Public URL that Headplane shows Tailscale clients in the UI.
  # install_headplane.sh substitutes server_url from headscale_config.json.
  public_url: "https://headscale.your-domain.com"

  # Reading the Headscale config gives the UI a full server-side picture.
  config_path: "/etc/headscale/config.yaml"

  # API key for server-side operations (reads nodes, users, keys).
  # install_headplane.sh issues a key via `docker exec headscale headscale
  # apikeys create --expiration 90d` and inserts it here.
  api_key: "REPLACE_WITH_HEADSCALE_API_KEY"

  # strict=false — do not crash if Headscale is upgraded and config.yaml
  # gains fields unknown to Headplane. Safer for a long-lived deploy.
  config_strict: false

integration:
  agent:
    enabled: false
    # headplane >= 0.6.x validates this field EVEN when enabled:false — it
    # must be a string. The agent is off, so the placeholder is unused.
    pre_authkey: "unused-agent-disabled"

  docker:
    # Enable so Headplane can reboot Headscale after ACL/DNS changes.
    enabled: true
    # By container_name, not by label — our container is named headscale.
    container_name: "headscale"
    socket: "unix:///var/run/docker.sock"

  kubernetes:
    enabled: false
    # headplane >= 0.6.x requires this field as a string even when enabled:false.
    pod_name: "headscale"

  proc:
    enabled: false

# OIDC is off — auth is the Headscale API key (sign-in at /admin).
# Enable only if you have an IdP (Authentik/Keycloak/Google) and know why.
# See https://headplane.net/features/sso
