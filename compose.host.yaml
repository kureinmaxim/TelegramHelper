# compose.host.yaml — override when the bot needs access to the host
# Tailscale/Headscale mesh (for example so /xui_setup can reach a 3x-ui
# panel on a mesh IP such as https://100.64.0.6:8081/...).
#
# === How to apply ===
# Use TOGETHER with the main compose.yaml via `-f` twice:
#
#   docker compose \
#     -f compose.yaml \
#     -f compose.host.yaml \
#     up -d --force-recreate
#
# Same pattern after an update (with a prior `git pull`):
#
#   cd /opt/TelegramHelper
#   git pull origin main
#   docker compose -f compose.yaml -f compose.host.yaml \
#     build --no-cache telegram-helper
#   docker compose -f compose.yaml -f compose.host.yaml \
#     up -d --force-recreate
#
# To switch back to the bridge network, just run without
# `-f compose.host.yaml`:
#
#   docker compose up -d --force-recreate
#
# === What the override does ===
# 1. telegram-helper switches to `network_mode: host` — the container
#    shares the host network namespace and sees all host interfaces:
#    eth0, lo, tailscale0, utun*. Mesh IPs (100.64.0.0/10 and
#    Tailscale ULA) then resolve and ping.
#
# 2. dockhand stays on the bridge network (cheaper / smaller blast
#    radius than host-mode) and gets a `telegram-helper:host-gateway`
#    alias via extra_hosts. That keeps
#    DOCKHAND_API_URL=http://telegram-helper:8000 working: dockhand
#    hits host-gateway:8000, and the bot already listens on that IP
#    because of host-mode.
#
# === What to watch for ===
# - With `network_mode: host`, Compose ignores the `ports:` block and
#   warns. That is expected — port 8000 now listens directly on the
#   host, with no NAT through the Docker bridge.
# - `pid: host` and `privileged: true` were already set in compose.yaml;
#   host networking does not change that security profile.
# - If a non-mesh service on the host also uses 8000, there will be a
#   conflict. Move the bot to another port via env (if the code supports
#   it) or return to bridge mode.
# - `host.docker.internal` is not available by default on Linux Docker;
#   we explicitly set `telegram-helper:host-gateway` because
#   `host-gateway` is the supported way for a container to reach the
#   host IP on modern Docker.

services:
  telegram-helper:
    network_mode: host
    # A host-network container shares the VPS network namespace. Docker
    # does not allow sysctls in this mode, so clear sysctls from compose.yaml.
    # Apply the PMTU workaround on the VPS itself via sysctl.
    sysctls: !override []
    # Drop the "Published ports are discarded when using host network mode"
    # warning; port 8000 listens directly on the host.
    ports: !override []

  dockhand:
    extra_hosts:
      # The bot is in host-mode, so Docker DNS no longer sees it as
      # `telegram-helper`. This alias resolves to the host IP from the
      # dockhand container; on the host the bot now listens on
      # 0.0.0.0:8000, so the request lands directly.
      - "telegram-helper:host-gateway"
